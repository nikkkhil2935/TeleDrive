name: Security Audit

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high || true
      - run: npm test
